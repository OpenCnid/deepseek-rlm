name: ci

on:
  push:
  pull_request:

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.14.4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.2'
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v6
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm check
      - run: pnpm package:bundle

  upstream-patches:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: 9.14.4
      - run: pnpm install --frozen-lockfile
      - run: git clone https://github.com/deepseek-ai/deepseek-harness.git /tmp/deepseek-harness
      - run: git -C /tmp/deepseek-harness checkout 99f6f02fecdb7dff40c3fbc9470f5907c29f74ca
      - run: pnpm verify:patches
        env:
          DSH_SOURCE: /tmp/deepseek-harness
      - name: Apply patches to pinned DSH checkout
        run: |
          git -C /tmp/deepseek-harness apply "$GITHUB_WORKSPACE/patches/deepseek-harness/0001-persisted-child-reasoning-effort.patch"
          git -C /tmp/deepseek-harness apply "$GITHUB_WORKSPACE/patches/deepseek-harness/0002-continuable-child-deletion.patch"
          git -C /tmp/deepseek-harness apply "$GITHUB_WORKSPACE/patches/deepseek-harness/0003-public-ignorable-session-events.patch"
      - run: pnpm dlx pnpm@11.7.0 --dir /tmp/deepseek-harness install --frozen-lockfile
      - run: pnpm dlx pnpm@11.7.0 --dir /tmp/deepseek-harness typecheck
      - name: Test patched DSH seams
        run: >-
          pnpm dlx pnpm@11.7.0 --dir /tmp/deepseek-harness exec vitest run
          packages/core/agent-loop/tests/request-reconstruction.spec.ts
          packages/core/session/tests/session.spec.ts
          packages/subagent/subagent/tests/continuation.spec.ts
          packages/subagent/subagent/tests/list-children.spec.ts
          packages/subagent/subagent/tests/deletion.spec.ts
