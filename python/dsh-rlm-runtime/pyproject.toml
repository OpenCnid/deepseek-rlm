[project]
name = "dsh-rlm-runtime"
version = "0.1.0"
description = "Kernel-side DSH bridge for the Prime-compatible RLM API"
requires-python = ">=3.10"
dependencies = ["ipykernel", "nest-asyncio"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dsh_rlm_runtime", "src/agent_message", "src/dsh_tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
